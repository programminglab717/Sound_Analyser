name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and alone: a licence violation should stop the build before
  # anyone spends runner minutes on it. See ADR 0006.
  licences:
    name: Licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency and model licences
        run: python3 tools/check_licences.py

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check clang-format
        run: |
          files=$(find src -name '*.cpp' -o -name '*.h')
          clang-format --dry-run --Werror $files

  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    needs: licences
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-debug
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-latest
            preset: debug
          - os: ubuntu-latest
            preset: release
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitize:
    name: ASan + UBSan
    needs: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # TODO(Phase 1): once Qt and FFmpeg are linked, add a job that inspects the
  # built binaries and fails if any LGPL library was linked statically. The
  # manifest gate above checks the declaration; this would check the reality.
