name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and alone: a licence violation should stop the build before
  # anyone spends runner minutes on it. See ADR 0006.
  licences:
    name: Licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check dependency and model licences
        run: python3 tools/check_licences.py

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check clang-format
        run: |
          files=$(find src -name '*.cpp' -o -name '*.h')
          clang-format --dry-run --Werror $files
      # Every standard library ships a different set of transitive includes.
      # libstdc++ pulls <algorithm> in through several common headers and the
      # MSVC STL does not, so a file using std::max with only <vector> compiles
      # on Linux and fails on Windows. This catches it here, in seconds, rather
      # than on a Windows runner one error at a time -- MSBuild stops at the
      # first error per project, so fifteen of these would have been fifteen
      # round trips.
      - name: Check includes
        run: python3 tools/check_includes.py

  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    needs: licences
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-debug
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-latest
            preset: debug
          - os: ubuntu-latest
            preset: release
    steps:
      - uses: actions/checkout@v5

      # Qt on Linux only. Windows deliberately builds without it, which keeps
      # the "sa-ui is optional" path honest: if the skip-when-absent branch in
      # src/sa-ui/CMakeLists.txt ever breaks, this matrix catches it.
      - name: Install Ninja and Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev libglu1-mesa-dev

      # Print the toolchain before configuring: when this job broke, the cause
      # was a pinned Visual Studio version the runner image no longer had, and
      # the failure said nothing about what it did have.
      - name: Show available Visual Studio installs
        if: runner.os == 'Windows'
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format value -property displayName
        continue-on-error: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Deliberately built without Qt: the sanitisers are here to police this
  # project's code, and a distribution Qt built without them reports its own
  # internals as leaks.
  sanitize:
    name: ASan + UBSan
    needs: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # Proves the whole path -- decode, peak pyramid, STFT, pyramid, log axis,
  # paint -- still produces the right picture. An exit code alone would pass on
  # a build that draws nothing, so this one reads the pixels back.
  interface:
    name: Interface smoke test
    needs: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja, Qt and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev libglu1-mesa-dev xvfb
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --target sound-analyser
      - name: Render and inspect
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/ui_smoke_test.py ./build/release/bin/sound-analyser --keep artefacts/window.png
      # Drawing the right picture and editing the right samples are separate
      # claims. An editor that cuts the wrong four seconds would pass the check
      # above, because that one stops at the picture.
      - name: Edit and verify the samples
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/ui_edit_test.py ./build/release/bin/sound-analyser
      - name: Upload the rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshot
          path: artefacts/
          if-no-files-found: ignore

  # sa-cli needs no Qt, so it gets its own job rather than riding on one that
  # installs it. It is also the path a batch user's script depends on, which
  # makes its output and its exit codes an interface rather than a convenience.
  cli:
    name: Headless driver
    needs: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --target sa-cli
      - name: Drive every command
        run: python3 tools/cli_test.py ./build/release/bin/sa-cli

  # A build the product owner can actually run. Everything above proves the code
  # is correct; this is what lets someone judge whether it is any good.
  #
  # It also closes the loop the licence gate can only half close: the gate checks
  # that Qt is *declared* as dynamically linked, and this checks that the thing
  # we would hand to a user really does carry Qt as separate DLLs it could
  # replace. A declaration and a binary disagreeing is exactly the failure ADR
  # 0006 exists to prevent.
  windows-package:
    name: Windows package
    needs: licences
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # aqtinstall directly rather than a marketplace action: it is one pip
      # package whose source we can read, and it keeps the Qt version visible
      # here rather than inside somebody else's action.
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.8.1 win64_msvc2022_64 --outputdir ${{ github.workspace }}/Qt
          echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/Qt/6.8.1/msvc2022_64" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Stage the application
        shell: pwsh
        run: |
          $stage = "package/Sound Analyser"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exe = Get-ChildItem -Recurse -Filter sound-analyser.exe |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "sound-analyser.exe was not built" }
          Copy-Item $exe $stage
          & "$env:CMAKE_PREFIX_PATH/bin/windeployqt.exe" --release --no-translations `
              --no-system-d3d-compiler --no-opengl-sw "$stage/sound-analyser.exe"

      # Qt is LGPL-3.0 and may only ship dynamically linked. windeployqt putting
      # the DLLs beside the executable is what makes that true in the artefact,
      # so their absence is a licence failure and not merely a broken build.
      - name: Check Qt ships as replaceable DLLs
        shell: pwsh
        run: |
          $stage = "package/Sound Analyser"
          foreach ($dll in @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll")) {
            if (-not (Test-Path "$stage/$dll")) {
              throw "$dll is missing: Qt must ship dynamically linked (ADR 0006)"
            }
          }
          Get-ChildItem $stage -Filter "Qt6*.dll" | ForEach-Object { Write-Host $_.Name }

      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: sound-analyser-windows
          path: package/
          if-no-files-found: error
