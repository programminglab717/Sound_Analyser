name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and alone: a licence violation should stop the build before
  # anyone spends runner minutes on it. See ADR 0006.
  licences:
    name: Licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check dependency and model licences
        run: python3 tools/check_licences.py

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check clang-format
        run: |
          files=$(find src -name '*.cpp' -o -name '*.h')
          clang-format --dry-run --Werror $files

  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    needs: licences
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-debug
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-latest
            preset: debug
          - os: ubuntu-latest
            preset: release
    steps:
      - uses: actions/checkout@v5

      # Qt on Linux only. Windows deliberately builds without it, which keeps
      # the "sa-ui is optional" path honest: if the skip-when-absent branch in
      # src/sa-ui/CMakeLists.txt ever breaks, this matrix catches it.
      - name: Install Ninja and Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev libglu1-mesa-dev

      # Print the toolchain before configuring: when this job broke, the cause
      # was a pinned Visual Studio version the runner image no longer had, and
      # the failure said nothing about what it did have.
      - name: Show available Visual Studio installs
        if: runner.os == 'Windows'
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format value -property displayName
        continue-on-error: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Deliberately built without Qt: the sanitisers are here to police this
  # project's code, and a distribution Qt built without them reports its own
  # internals as leaks.
  sanitize:
    name: ASan + UBSan
    needs: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # Proves the whole path -- decode, peak pyramid, STFT, pyramid, log axis,
  # paint -- still produces the right picture. An exit code alone would pass on
  # a build that draws nothing, so this one reads the pixels back.
  interface:
    name: Interface smoke test
    needs: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja, Qt and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev libglu1-mesa-dev xvfb
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --target sound-analyser
      - name: Render and inspect
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/ui_smoke_test.py ./build/release/bin/sound-analyser --keep artefacts/window.png
      # Drawing the right picture and editing the right samples are separate
      # claims. An editor that cuts the wrong four seconds would pass the check
      # above, because that one stops at the picture.
      - name: Edit and verify the samples
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/ui_edit_test.py ./build/release/bin/sound-analyser
      - name: Upload the rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshot
          path: artefacts/
          if-no-files-found: ignore

  # TODO(Phase 1): now that Qt is linked, add a job that inspects the built
  # binaries and fails if any LGPL library was linked statically. The manifest
  # gate above checks the declaration; this would check the reality.
