name: CI

on:
  push:
    branches: ["**"]
    # A tag beginning with v is what publishes a release. Everything below runs
    # exactly as it does for a branch push -- the same build, the same tests,
    # the same gates -- and the windows-package job then attaches what it built
    # to a GitHub Release. Nothing ships that did not pass the whole suite.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and alone: a licence violation should stop the build before
  # anyone spends runner minutes on it. See ADR 0006.
  licences:
    name: Licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check dependency and model licences
        run: python3 tools/check_licences.py

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check clang-format
        run: |
          files=$(find src -name '*.cpp' -o -name '*.h')
          clang-format --dry-run --Werror $files
      # Every standard library ships a different set of transitive includes.
      # libstdc++ pulls <algorithm> in through several common headers and the
      # MSVC STL does not, so a file using std::max with only <vector> compiles
      # on Linux and fails on Windows. This catches it here, in seconds, rather
      # than on a Windows runner one error at a time -- MSBuild stops at the
      # first error per project, so fifteen of these would have been fifteen
      # round trips.
      - name: Check includes
        run: python3 tools/check_includes.py
      # Same bargain as the include check above, for the installer: everything
      # about the WiX sources that can be decided from the text is decided here
      # in a second, rather than twenty minutes into a Windows job that had to
      # compile and test the whole product before it got as far as candle. It is
      # not Windows Installer validation and does not pretend to be; only
      # light.exe and a real machine can say the package works.
      - name: Check the installer sources
        run: python3 tools/check_installer.py

  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    needs: licences
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-debug
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-latest
            preset: debug
          - os: ubuntu-latest
            preset: release
    steps:
      - uses: actions/checkout@v5

      # Qt on Linux only. Windows deliberately builds without it, which keeps
      # the "sa-ui is optional" path honest: if the skip-when-absent branch in
      # src/sa-ui/CMakeLists.txt ever breaks, this matrix catches it.
      - name: Install Ninja and Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev libglu1-mesa-dev

      # Print the toolchain before configuring: when this job broke, the cause
      # was a pinned Visual Studio version the runner image no longer had, and
      # the failure said nothing about what it did have.
      - name: Show available Visual Studio installs
        if: runner.os == 'Windows'
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format value -property displayName
        continue-on-error: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Deliberately built without Qt: the sanitisers are here to police this
  # project's code, and a distribution Qt built without them reports its own
  # internals as leaks.
  sanitize:
    name: ASan + UBSan
    needs: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # A separate run because ThreadSanitizer cannot share a binary with
  # AddressSanitizer, and because the faults it finds are a different kind: not
  # a bad access that happens every time, but a race that happens on a loaded
  # machine once in a hundred runs. One of those reached this repository -- a
  # background spectrogram build reading a document while an edit rewrote it --
  # and nothing else here would have caught it.
  race:
    name: ThreadSanitizer
    needs: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan
      # A clean sanitiser run is evidence only if the sanitiser was awake, and
      # nothing about a green job distinguishes "no races" from "the flags
      # stopped reaching the compiler". This compiles a program that is a data
      # race and nothing else, with the flags read out of the build directory,
      # and fails if it is not reported.
      - name: Check ThreadSanitizer is awake
        run: python3 tools/tsan_selftest.py build/tsan
      - name: Test
        run: ctest --preset tsan
        env:
          TSAN_OPTIONS: halt_on_error=1

  # Proves the whole path -- decode, peak pyramid, STFT, pyramid, log axis,
  # paint -- still produces the right picture. An exit code alone would pass on
  # a build that draws nothing, so this one reads the pixels back.
  interface:
    name: Interface smoke test
    needs: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja, Qt and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev libglu1-mesa-dev xvfb
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --target auscultate
      - name: Render and inspect
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/ui_smoke_test.py ./build/release/bin/auscultate --keep artefacts/window.png
      # Drawing the right picture and editing the right samples are separate
      # claims. An editor that cuts the wrong four seconds would pass the check
      # above, because that one stops at the picture.
      - name: Edit and verify the samples
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/ui_edit_test.py ./build/release/bin/auscultate
      # Dragging a band and reading a measurement back are each a claim the two
      # checks above cannot make: they stop at the picture and at the samples,
      # and neither touches the controls that produce a number on screen.
      - name: Drag the equaliser and check the curve
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/ui_eq_test.py ./build/release/bin/auscultate
      - name: Check the analysis the window reports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/ui_analysis_test.py ./build/release/bin/auscultate
      # Settings are a state machine with a file on disk, so what matters is
      # the awkward cases: nothing stored, a file full of rubbish, a file
      # written by a newer build, and a geometry that would open the window on
      # a monitor that is no longer attached. The windowless tests decide what
      # each of those should do; this checks that a real window does it.
      - name: Check the settings survive a restart
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/ui_settings_test.py ./build/release/bin/auscultate
      - name: Upload the rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshot
          path: artefacts/
          if-no-files-found: ignore

  # auscultate-cli needs no Qt, so it gets its own job rather than riding on one that
  # installs it. It is also the path a batch user's script depends on, which
  # makes its output and its exit codes an interface rather than a convenience.
  cli:
    name: Headless driver
    needs: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --target auscultate-cli
      - name: Drive every command
        run: python3 tools/cli_test.py ./build/release/bin/auscultate-cli

  # A build the product owner can actually run. Everything above proves the code
  # is correct; this is what lets someone judge whether it is any good.
  #
  # It also closes the loop the licence gate can only half close: the gate checks
  # that Qt is *declared* as dynamically linked, and this checks that the thing
  # we would hand to a user really does carry Qt as separate DLLs it could
  # replace. A declaration and a binary disagreeing is exactly the failure ADR
  # 0006 exists to prevent.
  windows-package:
    name: Windows package
    needs: licences
    runs-on: windows-latest
    # Only for the release step below; every other job keeps the default
    # read-only token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # aqtinstall directly rather than a marketplace action: it is one pip
      # package whose source we can read, and it keeps the Qt version visible
      # here rather than inside somebody else's action.
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.8.1 win64_msvc2022_64 --outputdir ${{ github.workspace }}/Qt
          echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/Qt/6.8.1/msvc2022_64" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Stage the application
        shell: pwsh
        run: |
          $stage = "package/Auscultate"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exe = Get-ChildItem -Recurse -Filter auscultate.exe |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "auscultate.exe was not built" }
          Copy-Item $exe $stage

          # The headless driver goes in the same folder. It links nothing the
          # window does not already bring, so it costs a megabyte and makes the
          # package usable from a script without a second download.
          $cli = Get-ChildItem -Recurse -Filter auscultate-cli.exe |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $cli) { throw "auscultate-cli.exe was not built" }
          Copy-Item $cli $stage

          & "$env:CMAKE_PREFIX_PATH/bin/windeployqt.exe" --release --no-translations `
              --no-system-d3d-compiler --no-opengl-sw "$stage/auscultate.exe"

          # The product ships unsigned, so a downloaded copy carries the Zone
          # Identifier mark and SmartScreen refuses it on reputation it has no
          # way to have earned. The launcher strips that mark from the extracted
          # folder and starts the application, which is what right-clicking the
          # zip and ticking Unblock does, applied after the fact and to every
          # file at once. The readme is what tells a user which of the two
          # Windows features is refusing them, since the remedies differ and
          # only one of them is inside our gift.
          Copy-Item "packaging/windows/Run Auscultate.bat" $stage
          Copy-Item "packaging/windows/README-FIRST.txt" $stage

          # Qt is LGPL-3.0 and ALSA LGPL-2.1, and both oblige us to convey their
          # licence text with the binaries rather than merely to link
          # dynamically. The licence agreement states that these are shipped, so
          # a package without them is both a broken promise and a licence
          # breach. nlohmann/json's MIT notice has to travel with it too.
          New-Item -ItemType Directory -Force -Path "$stage/licences" | Out-Null
          Copy-Item "packaging/licences/*.txt" "$stage/licences"
          Copy-Item "docs/EULA.md" "$stage/EULA.txt"
          Copy-Item "docs/PRIVACY.md" "$stage/PRIVACY.txt"

          # WiX's own licence travels too: nothing of it links into the
          # executables, but the .msi embeds its custom-action library, so the
          # installer file contains WiX code and MS-RL 3(D) asks for its text.
          Copy-Item "packaging/windows/licences/*.txt" "$stage/licences"

      # Qt is LGPL-3.0 and may only ship dynamically linked. windeployqt putting
      # the DLLs beside the executable is what makes that true in the artefact,
      # so their absence is a licence failure and not merely a broken build.
      - name: Check Qt ships as replaceable DLLs
        shell: pwsh
        run: |
          $stage = "package/Auscultate"
          foreach ($dll in @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll")) {
            if (-not (Test-Path "$stage/$dll")) {
              throw "$dll is missing: Qt must ship dynamically linked (ADR 0006)"
            }
          }
          # A package whose launcher is missing is one a user cannot start, and
          # that is worth failing the build over rather than discovering on a
          # machine with Smart App Control on.
          foreach ($aid in @("Run Auscultate.bat", "README-FIRST.txt")) {
            if (-not (Test-Path "$stage/$aid")) { throw "$aid is missing from the package" }
          }
          # Shipping Qt's DLLs without Qt's licence satisfies half of the LGPL
          # and breaches the other half, so this is a build failure and not a
          # warning.
          foreach ($text in @("licences/LGPL-3.0.txt", "licences/GPL-3.0.txt",
                              "licences/THIRD-PARTY-NOTICES.txt",
                              "licences/nlohmann_json-MIT.txt", "EULA.txt")) {
            if (-not (Test-Path "$stage/$text")) {
              throw "$text is missing: the LGPL requires its text to ship with the binaries"
            }
          }
          Get-ChildItem $stage -Filter "Qt6*.dll" | ForEach-Object { Write-Host $_.Name }

      # The portable artefact, uploaded before anything to do with the
      # installer runs. Some users would rather unzip and run, and a broken
      # installer step should not take that away from them.
      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: auscultate-windows
          path: package/
          if-no-files-found: error

      # An Actions artefact is not a way to give somebody a program. It expires,
      # and downloading one needs a signed-in GitHub account even when the
      # repository is public -- so a tester without an account cannot get the
      # file at all, however public the source is.
      #
      # A release asset has a permanent public URL and needs no account. That is
      # the difference between handing someone a repository and handing them the
      # program. gh is already on the runner, so this needs no third-party
      # action, and the notes are a file in the repository rather than a string
      # buried in this workflow, so they can be reviewed like anything else.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "auscultate-$tag-windows-x64.zip"
          Compress-Archive -Path package/Auscultate -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $notes = Get-Content packaging/windows/release-notes.md -Raw
          $notes = $notes.Replace('__TAG__', $tag).Replace('__HASH__', $hash)
          $notes | Out-File -FilePath release-notes.txt -Encoding utf8
          # Either route has to work. Pushing a tag from a clone gets here with
          # no release yet, and drafting one in GitHub's web interface creates
          # the tag and the release together and gets here with one already
          # made. Creating unconditionally would fail on the second, which is
          # the route a person is most likely to take.
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "A release for $tag exists; attaching the build to it."
              gh release upload $tag $zip --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          } else {
              gh release create $tag $zip --title "Auscultate $tag" --notes-file release-notes.txt
              if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }

      # -- Installer ---------------------------------------------------------
      #
      # WiX rather than NSIS. Both are free forever with no cap, so the licence
      # constraint does not separate them; what separates them is the runner.
      # The windows-latest image (Windows Server 2025) ships WiX Toolset 3.14
      # and adds its bin directory to PATH; it does not ship NSIS, which was
      # last on the Windows Server 2022 image. NSIS would therefore mean a
      # chocolatey install on every run: another network dependency in a job
      # that already has two, and a version that drifts underneath us.
      #
      # The format matters as much as the tool. An MSI gets a real entry in
      # Installed apps, and Windows Installer -- not a script we wrote -- is
      # what removes the files, the registry values and the shortcut again. An
      # uninstaller that leaves nothing behind is the hardest part of an
      # installer to get right, and this is the option where we write the least
      # of it ourselves.
      - name: Locate the WiX toolset
        shell: pwsh
        run: |
          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          if (-not $candle -and $env:WIX) {
            $viaEnvironment = Join-Path $env:WIX "bin\candle.exe"
            if (Test-Path $viaEnvironment) { $candle = $viaEnvironment }
          }
          if (-not $candle) {
            $candle = Get-ChildItem "C:\Program Files*\WiX Toolset*\bin\candle.exe" `
                        -ErrorAction SilentlyContinue |
                      Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $candle) {
            throw "WiX was not found on this runner. The windows-latest image is documented as shipping WiX Toolset 3.14 with its bin directory on PATH; if that has changed, add an install step rather than removing this check."
          }
          # Print it for the same reason the Visual Studio step above prints:
          # when this breaks, the failure should say what the runner had.
          Write-Host "WiX: $candle ($((Get-Item $candle).VersionInfo.ProductVersion))"
          "WIX_BIN=$(Split-Path $candle)" | Out-File $env:GITHUB_ENV -Append

      - name: Prepare the installer inputs
        shell: pwsh
        run: |
          python tools/make_installer_wxs.py --stage package/Auscultate `
              --out installer/files.wxs --version-out installer/version.txt
          python tools/make_eula_rtf.py docs/EULA.md installer/EULA.rtf

      # The same claim the staged-folder check above makes, carried one step
      # further: the file list the installer is built from names Qt as separate
      # DLLs. light.exe refuses to build a package whose File elements point at
      # files that are not there, so a green build after this check means those
      # DLLs really are packed. Opening the finished .msi would be a stronger
      # statement still; this is the strongest one available without running
      # Windows Installer inside the job.
      - name: Check the installer packages Qt as replaceable DLLs
        shell: pwsh
        run: |
          foreach ($dll in @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll")) {
            if (-not (Select-String -Path installer/files.wxs -SimpleMatch $dll -Quiet)) {
              throw "$dll is not in the installer's file list: Qt must ship dynamically linked (ADR 0006)"
            }
          }

      # No signing step, deliberately. The product ships unsigned: there is no
      # budget for a code-signing certificate and no certificate authority
      # issues one free. docs/INSTALLING.md says plainly what a user will see
      # because of that. This is a decision, not an omission -- do not "fix" it
      # by failing the build when no certificate is configured.
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content installer/version.txt -Raw).Trim()
          $licence = (Resolve-Path installer/EULA.rtf).Path
          New-Item -ItemType Directory -Force -Path installer\obj | Out-Null
          # Quoted, because candle received the literal text '$version' rather
          # than its value: PowerShell does not expand a bare argument of the
          # form -name=$var the way it expands one inside a double-quoted
          # string. The whole argument is one string, so there is nothing left
          # to parse ambiguously.
          & "$env:WIX_BIN\candle.exe" -nologo -arch x64 `
              "-dProductVersion=$version" "-dLicenceRtf=$licence" `
              -ext WixUIExtension `
              -out installer\obj\ `
              packaging\windows\auscultate.wxs installer\files.wxs
          # Validation (the ICE suite) is left on. If it reports something, that
          # is a fault in the authoring to be fixed, not a switch to turn off.
          & "$env:WIX_BIN\light.exe" -nologo -ext WixUIExtension `
              -out "installer\auscultate-$version-x64.msi" `
              installer\obj\auscultate.wixobj installer\obj\files.wixobj

      # An unsigned download is one a user cannot check by its signature, so
      # give them the one thing they can check it by. This is also why the
      # checksum is printed into the job summary: it comes from the build, not
      # from the same page as the file.
      - name: Publish the checksum
        shell: pwsh
        run: |
          # -Filter is avoided here: its wildcards also match 8.3 short names,
          # which is how "*.msi" ends up matching things that are not one.
          $msi = Get-ChildItem installer -File |
                 Where-Object Extension -eq ".msi" |
                 Select-Object -First 1
          if (-not $msi) { throw "candle and light reported success but produced no .msi" }
          # Qt's three core DLLs alone are several megabytes compressed, so
          # anything under a megabyte is an empty package rather than a small one.
          if ($msi.Length -lt 1MB) {
            throw "$($msi.Name) is only $($msi.Length) bytes: the payload is missing"
          }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($msi.Name)" | Set-Content "$($msi.FullName).sha256"
          "### Windows installer" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "``$($msi.Name)`` - $([math]::Round($msi.Length / 1MB, 1)) MB" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
          "SHA-256 ``$hash``" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "Unsigned: Windows will show SmartScreen. See docs/INSTALLING.md." |
              Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: auscultate-windows-installer
          path: |
            installer/*.msi
            installer/*.msi.sha256
          if-no-files-found: error
